name: FixIt — Full Stack CI/CD (Test → Build → Deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: fixit-production-app
  S3_BUCKET: fixit-frontend-app

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Test Backend
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit --ci

      - name: TypeScript compile check
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Test Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:ci

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Backend Docker Image to ECR
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: 🐳 Build & Push Backend to ECR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: backend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Build Frontend Static Export
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: 🏗️ Build Frontend Static Export
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://fixit-production-alb-1117262851.ap-southeast-1.elb.amazonaws.com"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-export
          path: frontend/out/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Deploy Backend to EC2
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trigger ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name fixit-production-asg \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}' || echo "Notice: An instance refresh is already in progress. New instances will automatically pick up the latest Docker image."
            
          echo "✅ ASG Instance Refresh triggered (or already in progress)!"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6: Deploy Frontend to S3 + CloudFront
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-static-export
          path: out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync out/_next/static s3://${{ env.S3_BUCKET }}/_next/static \
            --delete --cache-control "public, max-age=31536000, immutable"

          aws s3 sync out/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "✅ Frontend uploaded to S3!"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DIST_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $CLOUDFRONT_DIST_ID \
              --paths "/*"
            echo "✅ CloudFront cache cleared!"
          else
            echo "No CloudFront distribution ID provided. Skipping."
          fi
